name: CI

on:
  workflow_call:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

# Cancel obsolete in-progress runs to save GitHub Actions minutes (cost optimization)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Set up Python 3.11
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Gradle check and unit tests
        run: ./gradlew check
        env:
          CHAQUOPY_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}

  emulator:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Set up Python 3.11
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI and conversion tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CHAQUOPY_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            ${{ github.event_name != 'workflow_dispatch' && '-Pandroid.testInstrumentationRunnerArguments.annotation=com.econverter.app.ConversionSmokeTest' || '' }}

      - name: Upload emulator test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

