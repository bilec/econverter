name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

# Cancel obsolete in-progress runs to save GitHub Actions minutes (cost optimization)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Set up Python 3.11
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Gradle check and unit tests
        run: ./gradlew check
        env:
          CHAQUOPY_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}

      - name: Run build logic tests
        run: ./gradlew -p buildSrc test

  emulator:
    needs: check
    # macOS runners are Apple Silicon: arm64 images get hardware acceleration and
    # exercise the same native libraries (PyPI arm wheels) that physical phones run.
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Set up Python 3.11
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: sdkmanager "ndk;30.0.16248370"

      - name: Run UI and conversion tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CHAQUOPY_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        with:
          api-level: 37
          target: google_apis
          arch: arm64-v8a
          disable-animations: true
          script: >-
            ./gradlew :app:connectedUniversalDebugAndroidTest
            ${{ github.event_name != 'workflow_dispatch' && '-Pandroid.testInstrumentationRunnerArguments.annotation=com.econverter.app.ConversionSmokeTest' || '' }}

      - name: Upload emulator test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
