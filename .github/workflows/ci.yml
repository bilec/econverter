name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Cancel obsolete in-progress runs to save GitHub Actions minutes (cost optimization)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv with cache
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Run Python linter and tests
        run: |
          uv sync
          uv run ruff check app/src/main/python
          uv run ruff format --check app/src/main/python
          uv run pytest

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Gradle Spotless check
        run: ./gradlew spotlessCheck

      - name: Run Gradle check and unit tests
        run: ./gradlew check

